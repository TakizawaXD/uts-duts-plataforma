<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="apiHead" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <filter id="shadowA" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreenA" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#4ade80"/>
    </marker>
  </defs>

  <style>
    .a-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 24px; font-weight: 800; fill: #ffffff; }
    .a-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #94a3b8; }
    .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 800; fill: #f8fafc; }
    .json-key { font-family: "JetBrains Mono", Consolas, monospace; font-size: 11px; fill: #38bdf8; }
    .json-str { font-family: "JetBrains Mono", Consolas, monospace; font-size: 11px; fill: #4ade80; }
    .json-num { font-family: "JetBrains Mono", Consolas, monospace; font-size: 11px; fill: #facc15; }
    .json-syntax { font-family: "JetBrains Mono", Consolas, monospace; font-size: 11px; fill: #94a3b8; }
    .code-badge { font-family: "JetBrains Mono", Consolas, monospace; font-size: 11px; font-weight: 700; }
  </style>

  <!-- Background -->
  <rect width="1100" height="520" rx="16" fill="url(#bgGradA)"/>

  <!-- Header -->
  <g transform="translate(50, 40)">
    <text x="0" y="20" class="a-title">API RESTful: Red Universitaria de Santander</text>
    <text x="0" y="40" class="a-sub">Integración interoperable de eventos académicos para UTS, UIS, UNAB, UDES y ASCUN Nodo Santander</text>
  </g>

  <!-- ================= CAJA 1: ENDPOINTS & PARÁMETROS ================= -->
  <g transform="translate(50, 95)" filter="url(#shadowA)">
    <rect width="450" height="385" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="450" height="40" rx="12" fill="url(#apiHead)"/>
    <rect y="32" width="450" height="8" fill="url(#apiHead)"/>
    <text x="18" y="26" class="box-title">Endpoints y Parámetros Disponibles</text>
    <rect x="360" y="10" width="75" height="20" rx="10" fill="#082f49"/>
    <text x="397.5" y="24" class="code-badge" fill="#7dd3fc" text-anchor="middle">CORS (*)</text>

    <g transform="translate(18, 55)">
      <!-- Endpoint 1 -->
      <rect y="0" width="414" height="65" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <rect x="12" y="12" width="46" height="20" rx="4" fill="#0369a1"/>
      <text x="35" y="26" class="code-badge" fill="#ffffff" text-anchor="middle">GET</text>
      <text x="68" y="27" font-family="monospace" font-size="12" font-weight="700" fill="#f8fafc">/api/eventos</text>
      <text x="12" y="50" font-family="sans-serif" font-size="11" fill="#94a3b8">Retorna catálogo completo con filtros opcionales de búsqueda.</text>

      <!-- Endpoint 2 -->
      <rect y="75" width="414" height="65" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <rect x="12" y="12" width="46" height="20" rx="4" fill="#0369a1"/>
      <text x="35" y="26" class="code-badge" fill="#ffffff" text-anchor="middle">GET</text>
      <text x="68" y="27" font-family="monospace" font-size="12" font-weight="700" fill="#f8fafc">/api/eventos/bucaramanga</text>
      <text x="12" y="50" font-family="sans-serif" font-size="11" fill="#94a3b8">Alias metropolitano para la agenda académica regional.</text>

      <!-- Query Params -->
      <text x="0" y="165" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#e2e8f0">Parámetros de Consulta (Query Strings):</text>
      
      <rect y="178" width="414" height="130" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <g transform="translate(14, 20)">
        <text x="0" y="14" font-family="monospace" font-size="11" font-weight="700" fill="#f59e0b">?universidad=</text>
        <text x="110" y="14" font-family="sans-serif" font-size="11" fill="#cbd5e1">UTS, UIS, UNAB, UDES o TODAS</text>

        <text x="0" y="44" font-family="monospace" font-size="11" font-weight="700" fill="#f59e0b">?categoria=</text>
        <text x="110" y="44" font-family="sans-serif" font-size="11" fill="#cbd5e1">TECNOLOGÍA, ROBÓTICA, DEPORTES...</text>

        <text x="0" y="74" font-family="monospace" font-size="11" font-weight="700" fill="#f59e0b">?q=</text>
        <text x="110" y="74" font-family="sans-serif" font-size="11" fill="#cbd5e1">Texto libre (título, lugar o descripción)</text>

        <text x="0" y="102" font-family="monospace" font-size="10.5" fill="#64748b">Ej: /api/eventos?universidad=UTS&amp;categoria=TECNOLOGIA</text>
      </g>
    </g>
  </g>

  <!-- Connectors -->
  <path d="M 500 240 L 535 240" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <path d="M 535 280 L 500 280" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowGreenA)"/>

  <!-- ================= CAJA 2: RESPUESTA JSON ================= -->
  <g transform="translate(540, 95)" filter="url(#shadowA)">
    <rect width="510" height="385" rx="12" fill="#0a0f1d" stroke="#334155" stroke-width="1.5"/>
    <rect width="510" height="36" rx="12" fill="#1e293b"/>
    <rect y="28" width="510" height="8" fill="#1e293b"/>
    
    <!-- Window buttons -->
    <circle cx="20" cy="18" r="5" fill="#ef4444"/>
    <circle cx="36" cy="18" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="18" r="5" fill="#10b981"/>
    <text x="75" y="22" font-family="monospace" font-size="11" fill="#94a3b8">application/json (HTTP 200 OK)</text>

    <!-- JSON Code Snippet -->
    <g transform="translate(20, 56)">
      <text x="0" y="14" class="json-syntax">{</text>
      <text x="16" y="32" class="json-key">"status"<tspan class="json-syntax">: </tspan><tspan class="json-str">"success"</tspan><tspan class="json-syntax">,</tspan></text>
      <text x="16" y="50" class="json-key">"origen"<tspan class="json-syntax">: </tspan><tspan class="json-str">"API Red Universitaria de Bucaramanga y Santander"</tspan><tspan class="json-syntax">,</tspan></text>
      <text x="16" y="68" class="json-key">"ciudad"<tspan class="json-syntax">: </tspan><tspan class="json-str">"Bucaramanga, Santander"</tspan><tspan class="json-syntax">,</tspan></text>
      <text x="16" y="86" class="json-key">"total"<tspan class="json-syntax">: </tspan><tspan class="json-num">12</tspan><tspan class="json-syntax">,</tspan></text>
      <text x="16" y="104" class="json-key">"eventos"<tspan class="json-syntax">: [</tspan></text>
      
      <!-- Object inside array -->
      <text x="32" y="122" class="json-syntax">{</text>
      <text x="48" y="140" class="json-key">"id"<tspan class="json-syntax">: </tspan><tspan class="json-num">1</tspan><tspan class="json-syntax">,</tspan></text>
      <text x="48" y="158" class="json-key">"universidad"<tspan class="json-syntax">: </tspan><tspan class="json-str">"UTS (uts.edu.co)"</tspan><tspan class="json-syntax">,</tspan></text>
      <text x="48" y="176" class="json-key">"titulo"<tspan class="json-syntax">: </tspan><tspan class="json-str">"Congreso Internacional de Robótica 2026"</tspan><tspan class="json-syntax">,</tspan></text>
      <text x="48" y="194" class="json-key">"categoria"<tspan class="json-syntax">: </tspan><tspan class="json-str">"TECNOLOGÍA"</tspan><tspan class="json-syntax">,</tspan></text>
      <text x="48" y="212" class="json-key">"recompensa_duts"<tspan class="json-syntax">: </tspan><tspan class="json-num">1500.0</tspan><tspan class="json-syntax">,</tspan></text>
      <text x="48" y="230" class="json-key">"lugar"<tspan class="json-syntax">: </tspan><tspan class="json-str">"Auditorio Mayor Edificio A, UTS"</tspan><tspan class="json-syntax">,</tspan></text>
      <text x="48" y="248" class="json-key">"google_maps_url"<tspan class="json-syntax">: </tspan><tspan class="json-str">"https://www.google.com/maps/..."</tspan><tspan class="json-syntax">,</tspan></text>
      <text x="48" y="266" class="json-key">"estado"<tspan class="json-syntax">: </tspan><tspan class="json-str">"ACTIVO"</tspan><tspan class="json-syntax">,</tspan></text>
      <text x="48" y="284" class="json-key">"fecha"<tspan class="json-syntax">: </tspan><tspan class="json-str">"2026-11-20 09:00:00"</tspan></text>
      <text x="32" y="302" class="json-syntax">}, ...</text>
      <text x="16" y="318" class="json-syntax">]</text>
      <text x="0" y="334" class="json-syntax">}</text>
    </g>
  </g>
</svg>

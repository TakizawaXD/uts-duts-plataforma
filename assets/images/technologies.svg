<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <filter id="shadowT" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <style>
    .t-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 24px; font-weight: 800; fill: #ffffff; }
    .t-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #94a3b8; }
    .cat-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
    .card-title-t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 800; fill: #f8fafc; }
    .card-version { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 10.5px; font-weight: 700; }
    .card-desc-t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #94a3b8; line-height: 1.4; }
    .tech-logo-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 12px; font-weight: 900; fill: #ffffff; }
  </style>

  <!-- Background -->
  <rect width="1100" height="480" rx="16" fill="url(#bgGradT)"/>

  <!-- Header -->
  <g transform="translate(50, 40)">
    <text x="0" y="20" class="t-title">Stack Tecnológico Oficial</text>
    <text x="0" y="40" class="t-sub">Herramientas, librerías y estándares industriales empleados en el desarrollo de UTS DUTS</text>
  </g>

  <!-- ================= FILA 1: BACKEND CORE ================= -->
  <text x="50" y="112" class="cat-title" fill="#38bdf8">Backend &amp; Servidor</text>

  <!-- Card 1: Java 21 -->
  <g transform="translate(50, 125)" filter="url(#shadowT)">
    <rect width="230" height="96" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <rect x="14" y="14" width="40" height="40" rx="8" fill="#ea580c"/>
    <text x="34" y="38" class="tech-logo-text" text-anchor="middle">JAVA</text>
    <text x="64" y="32" class="card-title-t">Java Platform</text>
    <rect x="64" y="38" width="58" height="18" rx="4" fill="#431407"/>
    <text x="93" y="51" class="card-version" fill="#fb923c" text-anchor="middle">JDK 21 LTS</text>
    <text x="14" y="80" class="card-desc-t">Lenguaje principal, Streams, Record DTOs y compilación release 21.</text>
  </g>

  <!-- Card 2: Servlets & JSP -->
  <g transform="translate(300, 125)" filter="url(#shadowT)">
    <rect width="230" height="96" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <rect x="14" y="14" width="40" height="40" rx="8" fill="#2563eb"/>
    <text x="34" y="38" class="tech-logo-text" text-anchor="middle">EE</text>
    <text x="64" y="32" class="card-title-t">Java EE / Servlets</text>
    <rect x="64" y="38" width="80" height="18" rx="4" fill="#172554"/>
    <text x="104" y="51" class="card-version" fill="#60a5fa" text-anchor="middle">Servlet 4.0 / JSP</text>
    <text x="14" y="80" class="card-desc-t">Filtros de codificación, autenticación y JSTL para plantillas dinámicas.</text>
  </g>

  <!-- Card 3: Apache Tomcat -->
  <g transform="translate(550, 125)" filter="url(#shadowT)">
    <rect width="230" height="96" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <rect x="14" y="14" width="40" height="40" rx="8" fill="#ca8a04"/>
    <text x="34" y="38" class="tech-logo-text" text-anchor="middle">TC</text>
    <text x="64" y="32" class="card-title-t">Apache Tomcat</text>
    <rect x="64" y="38" width="75" height="18" rx="4" fill="#422006"/>
    <text x="101.5" y="51" class="card-version" fill="#facc15" text-anchor="middle">v9.0 / v10.0</text>
    <text x="14" y="80" class="card-desc-t">Servidor web de aplicaciones Java y contenedor de servlets embebido.</text>
  </g>

  <!-- Card 4: Maven -->
  <g transform="translate(800, 125)" filter="url(#shadowT)">
    <rect width="250" height="96" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <rect x="14" y="14" width="40" height="40" rx="8" fill="#dc2626"/>
    <text x="34" y="38" class="tech-logo-text" text-anchor="middle">MVN</text>
    <text x="64" y="32" class="card-title-t">Apache Maven</text>
    <rect x="64" y="38" width="65" height="18" rx="4" fill="#450a0a"/>
    <text x="96.5" y="51" class="card-version" fill="#f87171" text-anchor="middle">v3.8 / v3.9</text>
    <text x="14" y="80" class="card-desc-t">Gestión del ciclo de vida, dependencias y empaquetado WAR automatizado.</text>
  </g>

  <!-- ================= FILA 2: DATOS, SEGURIDAD & REPORTES ================= -->
  <text x="50" y="272" class="cat-title" fill="#4ade80">Persistencia, Seguridad &amp; Frontend</text>

  <!-- Card 5: MySQL -->
  <g transform="translate(50, 285)" filter="url(#shadowT)">
    <rect width="230" height="145" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <rect x="14" y="14" width="40" height="40" rx="8" fill="#0284c7"/>
    <text x="34" y="38" class="tech-logo-text" text-anchor="middle">SQL</text>
    <text x="64" y="32" class="card-title-t">MySQL Database</text>
    <rect x="64" y="38" width="80" height="18" rx="4" fill="#082f49"/>
    <text x="104" y="51" class="card-version" fill="#38bdf8" text-anchor="middle">MySQL 8.0</text>
    <text x="14" y="80" class="card-desc-t">• Motor InnoDB ACID</text>
    <text x="14" y="98" class="card-desc-t">• Driver com.mysql:mysql-connector-j</text>
    <text x="14" y="116" class="card-desc-t">• Relaciones e Integridad Referencial</text>
  </g>

  <!-- Card 6: BCrypt -->
  <g transform="translate(300, 285)" filter="url(#shadowT)">
    <rect width="230" height="145" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <rect x="14" y="14" width="40" height="40" rx="8" fill="#15803d"/>
    <text x="34" y="38" class="tech-logo-text" text-anchor="middle">SEC</text>
    <text x="64" y="32" class="card-title-t">BCrypt Cripto</text>
    <rect x="64" y="38" width="60" height="18" rx="4" fill="#052e16"/>
    <text x="94" y="51" class="card-version" fill="#4ade80" text-anchor="middle">jbcrypt 0.4</text>
    <text x="14" y="80" class="card-desc-t">• Salting aleatorio 12 rondas</text>
    <text x="14" y="98" class="card-desc-t">• Hashing irreversible</text>
    <text x="14" y="116" class="card-desc-t">• Protección contra Rainbow Tables</text>
  </g>

  <!-- Card 7: iTextPDF -->
  <g transform="translate(550, 285)" filter="url(#shadowT)">
    <rect width="230" height="145" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <rect x="14" y="14" width="40" height="40" rx="8" fill="#b91c1c"/>
    <text x="34" y="38" class="tech-logo-text" text-anchor="middle">PDF</text>
    <text x="64" y="32" class="card-title-t">iTextPDF Engine</text>
    <rect x="64" y="38" width="68" height="18" rx="4" fill="#450a0a"/>
    <text x="98" y="51" class="card-version" fill="#f87171" text-anchor="middle">v5.5.13.3</text>
    <text x="14" y="80" class="card-desc-t">• Facturas electrónicas en vivo</text>
    <text x="14" y="98" class="card-desc-t">• Marca de agua y tablas dinámicas</text>
    <text x="14" y="116" class="card-desc-t">• Extractos consolidados PDF</text>
  </g>

  <!-- Card 8: Frontend & PWA -->
  <g transform="translate(800, 285)" filter="url(#shadowT)">
    <rect width="250" height="145" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <rect x="14" y="14" width="40" height="40" rx="8" fill="#4f46e5"/>
    <text x="34" y="38" class="tech-logo-text" text-anchor="middle">WEB</text>
    <text x="64" y="32" class="card-title-t">Frontend &amp; PWA</text>
    <rect x="64" y="38" width="95" height="18" rx="4" fill="#1e1b4b"/>
    <text x="111.5" y="51" class="card-version" fill="#818cf8" text-anchor="middle">HTML5 / CSS3 / PWA</text>
    <text x="14" y="80" class="card-desc-t">• Sistema de diseño institucional UTS</text>
    <text x="14" y="98" class="card-desc-t">• Service Worker &amp; Offline Cache</text>
    <text x="14" y="116" class="card-desc-t">• Generación dinámica de APK/ZIP</text>
  </g>
</svg>
